<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>简易飞机大战</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: none; /* 禁止手机下拉刷新和页面滚动 */
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: sans-serif;
            overflow: hidden;
        }
        #info {
            position: absolute;
            top: 15px;
            font-size: 18px;
            font-weight: bold;
            z-index: 10;
            text-shadow: 0 0 5px #000;
        }
        canvas {
            border: 2px solid #333;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            max-width: 100%;
            max-height: 100vh;
        }
    </style>
</head>
<body>

<div id="info">得分: <span id="score">0</span> | 生命: <span id="lives">3</span></div>
<canvas id="gameCanvas" width="360" height="640"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');

let score = 0;
let lives = 3;
let gameOver = false;
let frameCount = 0;

// 玩家小飞机
const player = {
    x: canvas.width / 2 - 15,
    y: canvas.height - 80,
    width: 30,
    height: 30,
    color: '#00ffff'
};

const playerBullets = [];
const enemyBullets = [];
const enemies = [];

// --- 触摸/拖动逻辑 ---
let isDragging = false;
let dragOffsetX = 0;
let dragOffsetY = 0;

function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
    };
}

function handleStart(e) {
    if (gameOver) return;
    const pos = getCanvasPos(e);
    isDragging = true;
    dragOffsetX = pos.x - player.x;
    dragOffsetY = pos.y - player.y;
}

function handleMove(e) {
    if (!isDragging || gameOver) return;
    const pos = getCanvasPos(e);
    
    // 更新飞机位置并限制在画布内
    player.x = Math.max(0, Math.min(canvas.width - player.width, pos.x - dragOffsetX));
    player.y = Math.max(0, Math.min(canvas.height - player.height, pos.y - dragOffsetY));
}

function handleEnd() {
    isDragging = false;
}

// 监听触摸事件 (手机)
canvas.addEventListener('touchstart', handleStart, { passive: false });
canvas.addEventListener('touchmove', handleMove, { passive: false });
canvas.addEventListener('touchend', handleEnd);

// 监听鼠标事件 (电脑测试)
canvas.addEventListener('mousedown', handleStart);
window.addEventListener('mousemove', handleMove);
window.addEventListener('mouseup', handleEnd);

// 键盘控制（保留支持）
const keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

// 重新开始游戏（点击屏幕）
canvas.addEventListener('click', () => {
    if (gameOver) {
        score = 0;
        lives = 3;
        gameOver = false;
        player.x = canvas.width / 2 - 15;
        player.y = canvas.height - 80;
        playerBullets.length = 0;
        enemyBullets.length = 0;
        enemies.length = 0;
        scoreEl.textContent = score;
        livesEl.textContent = lives;
        requestAnimationFrame(gameLoop);
    }
});

function gameLoop() {
    if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff0000';
        ctx.font = '28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = '16px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('点击屏幕重新开始', canvas.width / 2, canvas.height / 2 + 30);
        return;
    }

    update();
    draw();
    requestAnimationFrame(gameLoop);
}

function update() {
    frameCount++;

    // 键盘移动支持
    if (keys['ArrowLeft'] || keys['a']) player.x = Math.max(0, player.x - 5);
    if (keys['ArrowRight'] || keys['d']) player.x = Math.min(canvas.width - player.width, player.x + 5);
    if (keys['ArrowUp'] || keys['w']) player.y = Math.max(0, player.y - 5);
    if (keys['ArrowDown'] || keys['s']) player.y = Math.min(canvas.height - player.height, player.y + 5);

    // 自动发射子弹
    if (frameCount % 8 === 0) {
        playerBullets.push({
            x: player.x + player.width / 2 - 2,
            y: player.y,
            width: 4,
            height: 10,
            speed: 9,
            color: '#ffff00'
        });
    }

    // 生成敌机
    if (frameCount % 45 === 0) {
        enemies.push({
            x: Math.random() * (canvas.width - 30),
            y: -30,
            width: 30,
            height: 30,
            speed: 2.5,
            color: '#ff0055'
        });
    }

    // 更新玩家子弹
    for (let i = playerBullets.length - 1; i >= 0; i--) {
        const b = playerBullets[i];
        b.y -= b.speed;
        if (b.y < -b.height) playerBullets.splice(i, 1);
    }

    // 更新敌机及敌机弹幕
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.speed;

        if (Math.random() < 0.025) {
            enemyBullets.push({
                x: e.x + e.width / 2 - 3,
                y: e.y + e.height,
                width: 6,
                height: 6,
                speed: 4.5,
                color: '#ff5500'
            });
        }

        if (e.y > canvas.height) enemies.splice(i, 1);
    }

    // 更新敌机子弹
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.y += eb.speed;
        if (eb.y > canvas.height) enemyBullets.splice(i, 1);
    }

    // 碰撞检测
    for (let i = enemies.length - 1; i >= 0; i--) {
        for (let j = playerBullets.length - 1; j >= 0; j--) {
            if (isColliding(enemies[i], playerBullets[j])) {
                enemies.splice(i, 1);
                playerBullets.splice(j, 1);
                score += 100;
                scoreEl.textContent = score;
                break;
            }
        }
    }

    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        if (isColliding(player, enemyBullets[i])) {
            enemyBullets.splice(i, 1);
            hitPlayer();
        }
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
        if (isColliding(player, enemies[i])) {
            enemies.splice(i, 1);
            hitPlayer();
        }
    }
}

function hitPlayer() {
    lives--;
    livesEl.textContent = lives;
    if (lives <= 0) {
        gameOver = true;
    }
}

function isColliding(rect1, rect2) {
    if (!rect1 || !rect2) return false;
    return rect1.x < rect2.x + rect2.width &&
           rect1.x + rect1.width > rect2.x &&
           rect1.y < rect2.y + rect2.height &&
           rect1.y + rect1.height > rect2.y;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 玩家
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.width, player.height);

    // 玩家子弹
    for (let b of playerBullets) {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.width, b.height);
    }

    // 敌机
    for (let e of enemies) {
        ctx.fillStyle = e.color;
        ctx.fillRect(e.x, e.y, e.width, e.height);
    }

    // 敌机子弹
    for (let eb of enemyBullets) {
        ctx.fillStyle = eb.color;
        ctx.beginPath();
        ctx.arc(eb.x + eb.width / 2, eb.y + eb.height / 2, eb.width / 2, 0, Math.PI * 2);
        ctx.fill();
    }
}

requestAnimationFrame(gameLoop);
</script>

</body>
</html>
