<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>简易飞机大战</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: sans-serif;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #fff;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }
        #info {
            margin-bottom: 10px;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div id="info">得分: <span id="score">0</span> | 生命: <span id="lives">3</span></div>
<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');

// 游戏状态
let score = 0;
let lives = 3;
let gameOver = false;
let frameCount = 0;

// 玩家小飞机
const player = {
    x: canvas.width / 2 - 15,
    y: canvas.height - 60,
    width: 30,
    height: 30,
    speed: 5,
    color: '#00ffff'
};

// 数组管理
const playerBullets = [];
const enemyBullets = [];
const enemies = [];

// 按键监听
const keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

// 游戏主循环
function gameLoop() {
    if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff0000';
        ctx.font = '30px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
        ctx.font = '16px sans-serif';
        ctx.fillStyle = '#fff';
        ctx.fillText('刷新页面重新开始', canvas.width / 2, canvas.height / 2 + 40);
        return;
    }

    update();
    draw();
    requestAnimationFrame(gameLoop);
}

function update() {
    frameCount++;

    // 1. 玩家移动 (键盘方向键或 WASD)
    if ((keys['ArrowLeft'] || keys['a']) && player.x > 0) player.x -= player.speed;
    if ((keys['ArrowRight'] || keys['d']) && player.x < canvas.width - player.width) player.x += player.speed;
    if ((keys['ArrowUp'] || keys['w']) && player.y > 0) player.y -= player.speed;
    if ((keys['ArrowDown'] || keys['s']) && player.y < canvas.height - player.height) player.y += player.speed;

    // 2. 玩家自动发射子弹 (每 10 帧自动射击)
    if (frameCount % 10 === 0) {
        playerBullets.push({
            x: player.x + player.width / 2 - 2,
            y: player.y,
            width: 4,
            height: 10,
            speed: 8,
            color: '#ffff00'
        });
    }

    // 3. 生成敌机 (每 60 帧生成一个)
    if (frameCount % 60 === 0) {
        enemies.push({
            x: Math.random() * (canvas.width - 30),
            y: -30,
            width: 30,
            height: 30,
            speed: 2,
            color: '#ff0055'
        });
    }

    // 4. 更新玩家子弹位置
    for (let i = playerBullets.length - 1; i >= 0; i--) {
        const b = playerBullets[i];
        b.y -= b.speed;
        if (b.y < -b.height) playerBullets.splice(i, 1);
    }

    // 5. 更新敌机及敌机弹幕
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.speed;

        // 敌机随机发射弹幕
        if (Math.random() < 0.02) {
            enemyBullets.push({
                x: e.x + e.width / 2 - 3,
                y: e.y + e.height,
                width: 6,
                height: 6,
                speed: 4,
                color: '#ff5500'
            });
        }

        // 超出屏幕移除
        if (e.y > canvas.height) enemies.splice(i, 1);
    }

    // 6. 更新敌机子弹
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.y += eb.speed;
        if (eb.y > canvas.height) enemyBullets.splice(i, 1);
    }

    // 7. 碰撞检测
    // 玩家子弹击中敌机
    for (let i = enemies.length - 1; i >= 0; i--) {
        for (let j = playerBullets.length - 1; j >= 0; j--) {
            if (isColliding(enemies[i], playerBullets[j])) {
                enemies.splice(i, 1);
                playerBullets.splice(j, 1);
                score += 100;
                scoreEl.textContent = score;
                break;
            }
        }
    }

    // 敌机子弹击中玩家
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        if (isColliding(player, enemyBullets[i])) {
            enemyBullets.splice(i, 1);
            hitPlayer();
        }
    }

    // 敌机直接撞击玩家
    for (let i = enemies.length - 1; i >= 0; i--) {
        if (isColliding(player, enemies[i])) {
            enemies.splice(i, 1);
            hitPlayer();
        }
    }
}

function hitPlayer() {
    lives--;
    livesEl.textContent = lives;
    if (lives <= 0) {
        gameOver = true;
    }
}

// 简单 AABB 矩形碰撞检测
function isColliding(rect1, rect2) {
    if (!rect1 || !rect2) return false;
    return rect1.x < rect2.x + rect2.width &&
           rect1.x + rect1.width > rect2.x &&
           rect1.y < rect2.y + rect2.height &&
           rect1.y + rect1.height > rect2.y;
}

// 绘制所有元素
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 绘制玩家
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.width, player.height);

    // 绘制玩家子弹
    for (let b of playerBullets) {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.width, b.height);
    }

    // 绘制敌机
    for (let e of enemies) {
        ctx.fillStyle = e.color;
        ctx.fillRect(e.x, e.y, e.width, e.height);
    }

    // 绘制敌机子弹
    for (let eb of enemyBullets) {
        ctx.fillStyle = eb.color;
        ctx.beginPath();
        ctx.arc(eb.x + eb.width / 2, eb.y + eb.height / 2, eb.width / 2, 0, Math.PI * 2);
        ctx.fill();
    }
}

// 启动游戏
requestAnimationFrame(gameLoop);
</script>

</body>
</html>
